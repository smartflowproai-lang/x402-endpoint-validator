name: x402 Validator

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run x402 Core Engine tests
        run: python -m pytest test_x402_conformance_engine.py test_bazaar_checker.py -v

      - name: Run Batch Validator tests
        run: python -m pytest test_batch_validator.py -v

      - name: Run Bot tests
        run: python -m pytest test_x402_discord_bot.py -v

      - name: Run Proxy tests
        run: python -m pytest test_x402_proxy_server.py test_x402_response_wrapper.py -v
        continue-on-error: true
