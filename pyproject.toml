[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-validator"
version = "0.3.0"
description = "x402 strict-v2 conformance engine: CLI, MCP server, batch auditor"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["x402", "validator", "blockchain", "payment", "conformance"]
authors = [
    {name = "Gael L Chulim", email = "mssali-ai@github.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]

requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.urls]
homepage = "https://github.com/smartflowproai-lang/x402-endpoint-validator"
repository = "https://github.com/smartflowproai-lang/x402-endpoint-validator"

[project.scripts]
x402-validate = "x402_validator.cli:main"
x402-mcp = "x402_validator.mcp_server:main"

[tool.setuptools.packages.find]
include = ["x402_validator*"]

[tool.setuptools]
include-package-data = true
package-data = {"x402_validator" = ["py.typed"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "tests/test_*.py"]
asyncio_mode = "strict"
